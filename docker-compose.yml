# Local Postgres for development and tests. Keep the major version equal to
# the Neon project (ADR 0002).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pekarna
      POSTGRES_PASSWORD: pekarna
      POSTGRES_DB: pekarna
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pekarna -d pekarna"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
