name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Hardening follows GitHub's guide (SHA-pinned actions, read-only token):
# https://docs.github.com/en/actions/reference/security/secure-use
permissions:
  contents: read

# New pushes to a PR cancel its older runs. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    # The deploy job is added with the hosting ADR.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Skips the checks until the app is scaffolded. hashFiles is not
      # available in a job-level `if`, so a step sets an output instead.
      - name: Check for an app
        id: app
        run: test -f package.json && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "No package.json yet, skipping checks."
      - if: steps.app.outputs.exists == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Node runs Next.js and Vitest; 26 is the first with Temporal by default.
      # The version comes from engines.node, as on Vercel.
      - if: steps.app.outputs.exists == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Install dependencies
        if: steps.app.outputs.exists == 'true'
        run: bun ci
      - name: Check formatting
        if: steps.app.outputs.exists == 'true'
        run: bun run format:check
      - name: Lint
        if: steps.app.outputs.exists == 'true'
        run: bun run lint
      - name: Unit tests
        if: steps.app.outputs.exists == 'true'
        run: bun run test
      - name: Build (includes typecheck)
        if: steps.app.outputs.exists == 'true'
        run: bun run build
        # The build imports the auth route, which needs these to be set. CI has
        # no database: the pool never connects and the values are throwaway.
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-build-only-not-a-real-secret-0000000000
      - name: Audit dependencies for known vulnerabilities
        if: steps.app.outputs.exists == 'true'
        run: bun audit --audit-level=high
