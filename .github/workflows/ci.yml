name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Hardening follows GitHub's guide (SHA-pinned actions, read-only token):
# https://docs.github.com/en/actions/reference/security/secure-use
permissions:
  contents: read

# New pushes to a PR cancel its older runs. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    # The deploy job is added with the hosting ADR.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Real Postgres 18 for the service tests (bun run test:db), as on Neon.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Skips the checks until the app is scaffolded. hashFiles is not
      # available in a job-level `if`, so a step sets an output instead.
      - name: Check for an app
        id: app
        run: test -f package.json && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "No package.json yet, skipping checks."
      - if: steps.app.outputs.exists == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Node runs Next.js and Vitest; 26 is the first with Temporal by default.
      # The version comes from engines.node, as on Vercel.
      - if: steps.app.outputs.exists == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Install dependencies
        if: steps.app.outputs.exists == 'true'
        run: bun ci
      - name: Check formatting
        if: steps.app.outputs.exists == 'true'
        run: bun run format:check
      - name: Lint
        if: steps.app.outputs.exists == 'true'
        run: bun run lint
      - name: Unit tests
        if: steps.app.outputs.exists == 'true'
        run: bun run test
      - name: Database tests
        if: steps.app.outputs.exists == 'true'
        run: bun run test:db
        env:
          TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      - name: Build (includes typecheck)
        if: steps.app.outputs.exists == 'true'
        run: bun run build
        # The build imports the auth route, which needs these to be set. The
        # pool never connects during the build; the values are throwaway.
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-build-only-not-a-real-secret-0000000000
      - name: Install Chromium for the end-to-end tests
        if: steps.app.outputs.exists == 'true'
        run: bunx playwright install --with-deps chromium
      # Runs the build above. The database tests are done, so their database
      # is reused; the global setup rebuilds it.
      - name: End-to-end tests
        if: steps.app.outputs.exists == 'true'
        run: bun run test:e2e
        env:
          E2E_DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      # Traces of failed tests, for `bunx playwright show-trace`.
      - name: Upload end-to-end traces
        if: failure() && steps.app.outputs.exists == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7
      - name: Audit dependencies for known vulnerabilities
        if: steps.app.outputs.exists == 'true'
        run: bun audit --audit-level=high
